# Form submissions are handled by formsender (https://github.com/osuosl/formsender),
# which creates RT tickets. One formsender instance serves this site, pointed at
# the OpenPOWER Foundation RT via its RT_URL. The token below must match that
# instance's TOKEN env var, and the reCAPTCHA site key must be paired with the
# RECAPTCHA_SECRET configured on the same instance.
# Per-form RT queues are defined in config/_default/params.toml.
[forms]
	endpoint = "https://formsender-opf.osuosl.org"
	token = "84aAvf8kelcEsFODjUDC0ZAnnOLW20awQlBWy6aYYCbN5iBIEtPVhmM7DxH2Vl455LiAe1sCpm8lzhxnS1r1mSJQOa"
	# Cloudflare Turnstile site key. Public, and paired with the
	# TURNSTILE_SECRET formsender-opf reads from its data bag.
	turnstile_sitekey = "0x4AAAAAAE8QPZ0FYNG-W7Zb"
	redirect = "https://openpowerfoundation.org/form-submitted/"
